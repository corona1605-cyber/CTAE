<p class="lead">30 preguntas basadas en los artículos del temario. Cada opción es una definición o texto legal: elige la que corresponde con exactitud. Para aprobar necesitas al menos 80 % de aciertos (24 de 30).</p>

</main><script>
var Q=[{"s": "Constitución y Ley del Seguro Social", "q": "El artículo 1° constitucional prohíbe la discriminación. ¿Qué enunciado reproduce correctamente su contenido?", "o": ["Prohíbe la discriminación por origen étnico, género y religión, dejando a las leyes secundarias los demás motivos.", "Prohíbe toda distinción entre personas, aun cuando sea objetiva y proporcional, salvo que la autorice el Congreso.", "Prohíbe la discriminación solo cuando proviene de autoridades; entre particulares se admite la distinción por condiciones de salud.", "Prohíbe toda discriminación motivada por origen étnico o nacional, género, edad, discapacidades, condición social, condiciones de salud, religión, opiniones, preferencias sexuales, estado civil o cualquier otra que atente contra la dignidad humana y anule o menoscabe derechos y libertades."]}, {"s": "Constitución y Ley del Seguro Social", "q": "¿Qué establece el artículo 4° constitucional respecto de la salud?", "o": ["El derecho a la protección de la salud se limita a quienes cotizan en algún régimen de seguridad social.", "Toda persona tiene derecho a la protección de la salud; la ley definirá las bases y modalidades de acceso a los servicios de salud y la concurrencia de la Federación y las entidades federativas en materia de salubridad general.", "Los servicios de salud son competencia exclusiva de las entidades federativas, que fijarán libremente sus modalidades de acceso.", "Toda persona trabajadora asegurada tiene derecho a la protección de la salud, y su regulación corresponde exclusivamente a la Federación."]}, {"s": "Constitución y Ley del Seguro Social", "q": "Conforme al artículo 4 de la Ley del Seguro Social, el Seguro Social es:", "o": ["Un instrumento complementario de la asistencia social, de carácter local y financiado únicamente con recursos fiscales.", "Un servicio privado concesionado por el Estado a los patrones para proteger a sus personas trabajadoras.", "Un sistema de ahorro individual administrado exclusivamente por las Administradoras de Fondos para el Retiro.", "El instrumento básico de la seguridad social, establecido como un servicio público de carácter nacional en los términos de la Ley, sin perjuicio de los sistemas instituidos por otros ordenamientos."]}, {"s": "Constitución y Ley del Seguro Social", "q": "El artículo 12 de la Ley del Seguro Social define a los sujetos de aseguramiento del régimen obligatorio. ¿Cuál es el listado correcto?", "o": ["Solo las personas con contrato por tiempo indeterminado inscritas por su patrón y sus beneficiarios.", "Las personas vinculadas a otras por una relación de trabajo, cualquiera que sea el acto que le dé origen; los socios de sociedades cooperativas; y las personas que determine el Ejecutivo Federal mediante decreto.", "Cualquier persona residente que lo solicite, aun sin relación de trabajo, mediante el pago de la cuota correspondiente.", "Únicamente las personas trabajadoras de la industria y el comercio, sus cónyuges e hijos."]}, {"s": "Constitución y Ley del Seguro Social", "q": "¿Qué dispone el artículo 3 de la Ley del Seguro Social?", "o": ["La seguridad social puede delegarse en instituciones privadas autorizadas por la CONSAR.", "La seguridad social está a cargo exclusivamente del IMSS y del ISSSTE, sin intervención de entidades locales.", "La seguridad social está a cargo de los patrones, quienes pueden transferirla a aseguradoras.", "La realización de la seguridad social está a cargo de entidades o dependencias públicas, federales o locales, y de organismos descentralizados, conforme a la Ley y demás ordenamientos aplicables."]}, {"s": "Constitución y Ley del Seguro Social", "q": "¿Qué dispone el artículo 1 de la Ley del Seguro Social sobre su aplicación y naturaleza?", "o": ["Es de observancia en las entidades federativas que la adopten por convenio; sus disposiciones son de orden privado.", "Es de observancia general en toda la República, en la forma y términos que la misma establece; sus disposiciones son de orden público y de interés social.", "Es de observancia local y supletoria de las leyes estatales de seguridad social; sus disposiciones son de interés público.", "Es de observancia general solo para personas trabajadoras sindicalizadas; sus disposiciones son de interés particular."]}, {"s": "Constitución y Ley del Seguro Social", "q": "¿Qué declara el artículo 123, apartado A, fracción XXIX de la Constitución?", "o": ["Es de utilidad pública la Ley del Seguro Social, que comprenderá seguros de invalidez, vejez, vida, cesación involuntaria del trabajo, enfermedades y accidentes, servicios de guardería y cualquier otro encaminado a la protección y bienestar de personas trabajadoras, campesinas, no asalariadas y otros sectores sociales y sus familiares.", "Es de interés privado la Ley del Seguro Social, que comprenderá únicamente seguros de enfermedades, maternidad y pensiones de personas asalariadas.", "Es de utilidad pública la Ley de Vivienda, que comprenderá créditos hipotecarios para personas trabajadoras y sus familiares.", "Es de utilidad pública la Ley del Seguro Social, a cargo de los patrones, que comprenderá exclusivamente seguros de riesgos de trabajo y guarderías."]}, {"s": "Transparencia y protección de datos personales", "q": "¿Qué comprende el derecho humano de acceso a la información según el artículo 4 de la Ley General de Transparencia (numeración del temario)?", "o": ["Acceder a datos personales de terceros siempre que exista un interés público.", "Solicitar y recibir información, previa acreditación de interés jurídico.", "Solicitar, investigar, difundir, buscar y recibir información.", "Acceder únicamente a la información que los sujetos obligados publican de oficio."]}, {"s": "Transparencia y protección de datos personales", "q": "Según el artículo 3 de la Ley General de Protección de Datos Personales en Posesión de Sujetos Obligados, “datos personales” son:", "o": ["Información que identifica directamente a una persona; si se requiere cruzar datos, deja de ser personal.", "Información de personas físicas o morales contenida en bases de datos públicas.", "Cualquier información concerniente a una persona física identificada o identificable; es identificable cuando su identidad puede determinarse directa o indirectamente a través de cualquier información.", "Solo los datos de la esfera más íntima cuya utilización indebida pueda originar discriminación."]}, {"s": "Transparencia y protección de datos personales", "q": "¿Qué es la “disociación” conforme al artículo 3 de la misma Ley?", "o": ["La separación de los datos sensibles en una base distinta con acceso restringido.", "La cancelación de los datos por solicitud del titular, previo periodo de bloqueo.", "La eliminación definitiva de los datos al concluir la finalidad, con constancia de supresión.", "El procedimiento mediante el cual los datos personales no pueden asociarse al titular ni permitir, por su estructura, contenido o grado de desagregación, su identificación."]}, {"s": "Transparencia y protección de datos personales", "q": "¿Cuál definición corresponde a “datos personales sensibles” (artículo 3)?", "o": ["Los que se refieren a la esfera más íntima de su titular, o cuya utilización indebida pueda dar origen a discriminación o conlleve un riesgo grave para este.", "Los que identifican a su titular, como nombre, domicilio, CURP y teléfono.", "Los de carácter patrimonial o financiero cuyo uso indebido genere un perjuicio económico.", "Los que el titular designa como confidenciales al momento de entregarlos al responsable."]}, {"s": "Transparencia y protección de datos personales", "q": "Una persona derechohabiente pide que el Instituto deje de tratar sus datos en un proceso automatizado que le produce efectos jurídicos no deseados. ¿Qué derecho ejerce y cómo se define?", "o": ["Cancelación: solicitar que sus datos se eliminen de archivos, registros, expedientes y sistemas del responsable para que dejen de ser tratados.", "Acceso: acceder a sus datos en posesión del responsable y conocer las condiciones y generalidades de su tratamiento.", "Oposición: oponerse al tratamiento o exigir que cese cuando, aun siendo lícito, su persistencia cause daño o perjuicio, o cuando sea automatizado y produzca efectos jurídicos no deseados o afecte significativamente sus intereses.", "Rectificación: solicitar la corrección de datos inexactos, incompletos o no actualizados."]}, {"s": "Transparencia y protección de datos personales", "q": "Conforme al artículo 3 de la Ley General de Protección de Datos Personales en Posesión de Sujetos Obligados, el “aviso de privacidad” es:", "o": ["El instrumento que describe las medidas de seguridad técnicas, físicas y administrativas adoptadas para garantizar la confidencialidad, integridad y disponibilidad de los datos.", "El documento mediante el cual el titular autoriza expresamente el tratamiento de sus datos personales.", "El documento a disposición del titular, en forma física, electrónica o cualquier formato, generado por el responsable desde el momento en que recaba sus datos, para informarle los propósitos del tratamiento.", "El instrumento con el que el responsable notifica a la autoridad garante una vulneración de seguridad de los datos."]}, {"s": "Transparencia y protección de datos personales", "q": "Según el artículo 3 de la misma Ley, el “responsable” es:", "o": ["La persona física o moral, pública o privada, que trata datos personales a nombre y por cuenta del responsable.", "Los sujetos obligados a que se refiere el artículo 1 de la Ley que deciden sobre el tratamiento de datos personales.", "La persona física a quien corresponden los datos personales.", "La persona servidora pública designada para recibir y dar trámite a las solicitudes de ejercicio de derechos ARCO."]}, {"s": "Responsabilidades administrativas", "q": "Conforme al artículo 3 de la Ley General de Responsabilidades Administrativas, el “conflicto de interés” es:", "o": ["La posible afectación del desempeño imparcial y objetivo de las funciones de las personas servidoras públicas en razón de intereses personales, familiares o de negocios.", "La incompatibilidad entre dos empleos públicos con horarios que se traslapan.", "Cualquier beneficio económico recibido con motivo de sus funciones, distinto de su remuneración.", "La situación de quien ha sido sancionado previamente por una falta administrativa grave."]}, {"s": "Responsabilidades administrativas", "q": "Una persona servidora pública acepta, por conducto de un tercero, un viaje pagado por un proveedor a cambio de agilizar sus pagos. ¿Qué falta grave se actualiza y cómo la define la Ley?", "o": ["Encubrimiento: realizar deliberadamente conductas tendientes a ocultar faltas administrativas que se advierten en el ejercicio de las funciones.", "Abuso de funciones: ejercer atribuciones que no se tienen conferidas o valerse de las que se tienen para realizar actos arbitrarios en beneficio propio o de un tercero.", "Cohecho: exigir, aceptar, obtener o pretender obtener, por sí o por terceros, con motivo de sus funciones, un beneficio no comprendido en su remuneración, para sí o para su cónyuge, parientes o terceros con los que tenga relaciones.", "Peculado: autorizar, solicitar o realizar actos para el uso o apropiación de recursos públicos materiales, humanos o financieros sin fundamento jurídico."]}, {"s": "Responsabilidades administrativas", "q": "Un agente induce a una compañera de otra área a retrasar un trámite para perjudicar a un competidor de su primo. ¿Qué falta se actualiza?", "o": ["Contratación indebida: autorizar contrataciones con personas inhabilitadas o con conflicto de interés.", "Utilización indebida de información: adquirir bienes o servicios aprovechando información privilegiada obtenida en el ejercicio de sus funciones.", "Tráfico de influencias: utilizar la posición del empleo, cargo o comisión para inducir a otra persona servidora pública a efectuar, retrasar u omitir un acto de su competencia, para generar un beneficio para sí o para terceros vinculados.", "Desacato: no dar respuesta o proporcionar información falsa a los requerimientos de autoridades con atribuciones."]}, {"s": "Responsabilidades administrativas", "q": "¿Qué distinción entre faltas administrativas no graves y graves establece la Ley?", "o": ["Ambas se resuelven siempre en los órganos internos de control; el Tribunal solo conoce de apelaciones.", "Se distinguen exclusivamente por el monto del daño patrimonial, sin importar la conducta.", "Las graves las resuelven los órganos internos de control; las no graves, el Tribunal de Justicia Administrativa.", "Las no graves se investigan, substancian y resuelven en los órganos internos de control; las graves se investigan por la autoridad investigadora y las resuelve el Tribunal de Justicia Administrativa."]}, {"s": "Responsabilidades administrativas", "q": "¿Qué enunciado enlista correctamente los principios que rigen el servicio público conforme al artículo 7 de la Ley General de Responsabilidades Administrativas?", "o": ["Certeza, eficacia, imparcialidad, independencia, legalidad, máxima publicidad, objetividad, profesionalismo y transparencia.", "Disciplina, legalidad, objetividad, profesionalismo, honradez, lealtad, imparcialidad, integridad, rendición de cuentas, eficacia y eficiencia.", "Universalidad, interdependencia, indivisibilidad y progresividad, además de honradez y eficiencia.", "Licitud, finalidad, lealtad, consentimiento, calidad, proporcionalidad, información y responsabilidad."]}, {"s": "Responsabilidades administrativas", "q": "Una persona servidora pública utiliza un vehículo oficial y personal de apoyo para la mudanza de su familia, sin fundamento jurídico. ¿Qué falta grave se actualiza y cómo se define?", "o": ["Abuso de funciones: ejercer atribuciones no conferidas o valerse de las que se tienen para realizar actos arbitrarios que causen perjuicio a alguna persona o al servicio público.", "Actuación bajo conflicto de interés: intervenir en la atención, tramitación o resolución de asuntos en los que se tiene conflicto de interés o impedimento legal.", "Peculado: autorizar, solicitar o realizar actos para el uso o apropiación, para sí o para terceros vinculados, de recursos públicos materiales, humanos o financieros sin fundamento jurídico o en contraposición a las normas aplicables.", "Cohecho: exigir, aceptar u obtener un beneficio no comprendido en su remuneración, con motivo de sus funciones."]}, {"s": "Igualdad y no discriminación", "q": "¿Cómo define la Ley Federal para Prevenir y Eliminar la Discriminación (art. 1, fracc. III) la discriminación?", "o": ["Toda restricción de derechos ejercida por autoridades públicas, por acción, con base en discapacidad, género o edad.", "Toda distinción o exclusión intencional, motivada por prejuicio, que lesione derechos de personas en situación de vulnerabilidad.", "Todo trato diferenciado entre personas, aun cuando sea objetivo, racional y proporcional.", "Toda distinción, exclusión, restricción o preferencia que, por acción u omisión, con intención o sin ella, no sea objetiva, racional ni proporcional y tenga por objeto o resultado obstaculizar, restringir, impedir, menoscabar o anular el reconocimiento, goce o ejercicio de derechos humanos y libertades."]}, {"s": "Igualdad y no discriminación", "q": "Un módulo de atención da un esquema de servicios distinto a las personas aseguradas y a la población en general. Según el artículo 5 de la Ley Federal para Prevenir y Eliminar la Discriminación:", "o": ["Es discriminatoria salvo que cuente con autorización expresa del Consejo Nacional para Prevenir la Discriminación.", "No se considera conducta discriminatoria la distinción que establecen las instituciones públicas de seguridad social entre sus personas aseguradas y la población en general.", "Solo es discriminatoria si no se acredita el pago de cuotas obrero-patronales.", "Es discriminatoria porque limita el derecho a la salud de la población en general."]}, {"s": "Igualdad y no discriminación", "q": "Instalar rampas y señalética en braille en una unidad médica corresponde, según el artículo 15 Bis de la Ley Federal para Prevenir y Eliminar la Discriminación, a:", "o": ["Medidas de nivelación: las que buscan hacer efectivo el acceso a la igualdad real de oportunidades eliminando barreras físicas, comunicacionales, normativas o de otro tipo, e incluyen ajustes razonables.", "Medidas de inclusión: acciones preventivas, educativas y de difusión que promueven la cultura de la no discriminación.", "Medidas sancionadoras: resoluciones del Consejo que imponen responsabilidades a quien incurre en conductas discriminatorias.", "Acciones afirmativas: medidas especiales, específicas y de carácter temporal a favor de personas o grupos en situación de discriminación."]}, {"s": "Igualdad y no discriminación", "q": "¿Qué enunciado distingue correctamente hostigamiento sexual y acoso sexual (art. 13 de la Ley General de Acceso de las Mujeres a una Vida Libre de Violencia)?", "o": ["Hostigamiento: violencia sin subordinación con abuso de poder; acoso: ejercicio del poder en una relación de subordinación real.", "Ambos exigen subordinación; el acoso se da únicamente en el ámbito escolar.", "Hostigamiento exige un solo evento; acoso exige reiteración de conductas.", "Hostigamiento: ejercicio del poder en una relación de subordinación real de la víctima frente al agresor, en el ámbito laboral y/o escolar; acoso: violencia sin subordinación, pero con ejercicio abusivo de poder que genera indefensión y riesgo para la víctima, en uno o varios eventos."]}, {"s": "Igualdad y no discriminación", "q": "¿Cuál es la definición de “perspectiva de género” del artículo 5 de la Ley General para la Igualdad entre Mujeres y Hombres?", "o": ["El conjunto de medidas de carácter temporal encaminadas a acelerar la igualdad de hecho entre mujeres y hombres.", "La situación en la que mujeres y hombres acceden con las mismas posibilidades y oportunidades al uso, control y beneficio de bienes, servicios y recursos.", "La metodología y los mecanismos que permiten identificar, cuestionar y valorar la discriminación, desigualdad y exclusión de las mujeres, justificadas en diferencias biológicas, y las acciones para crear condiciones de cambio hacia la igualdad de género.", "El proceso que garantiza la incorporación de la igualdad en toda acción que se programe, en legislación, políticas públicas y actividades de instituciones públicas y privadas."]}, {"s": "Igualdad y no discriminación", "q": "¿Cuál de los siguientes textos corresponde al artículo 3 de la CEDAW?", "o": ["Las medidas especiales de carácter temporal encaminadas a acelerar la igualdad de hecho no se considerarán discriminación y cesarán al alcanzarse los objetivos de igualdad.", "Los Estados condenan la discriminación contra la mujer en todas sus formas y convienen en seguir, por todos los medios apropiados y sin dilaciones, una política encaminada a eliminarla.", "Las medidas especiales encaminadas a proteger la maternidad no se considerarán discriminatorias.", "Los Estados tomarán, en todas las esferas y en particular en la política, social, económica y cultural, todas las medidas apropiadas, incluso legislativas, para asegurar el pleno desarrollo y adelanto de la mujer y garantizarle derechos humanos y libertades en igualdad de condiciones con el hombre."]}, {"s": "Igualdad y no discriminación", "q": "¿Cuál de las siguientes es una conducta discriminatoria enlistada en el artículo 9 de la Ley Federal para Prevenir y Eliminar la Discriminación?", "o": ["Establecer distinciones basadas en capacidades o conocimientos especializados para desempeñar una actividad determinada.", "Negar o condicionar los servicios de atención médica, o impedir la participación en las decisiones sobre su tratamiento médico o terapéutico dentro de sus posibilidades y medios.", "Aplicar acciones afirmativas que promuevan la igualdad real de oportunidades de grupos en situación de discriminación.", "Distinguir entre personas aseguradas y población en general en una institución pública de seguridad social."]}, {"s": "Igualdad y no discriminación", "q": "¿Cómo define el artículo 5 de la Ley General para la Igualdad entre Mujeres y Hombres la “igualdad sustantiva”?", "o": ["El acceso al mismo trato y oportunidades para el reconocimiento, goce o ejercicio de los derechos humanos y las libertades fundamentales.", "El conjunto de medidas de carácter temporal encaminadas a acelerar la igualdad de hecho entre mujeres y hombres.", "El proceso que garantiza la incorporación de la perspectiva de género en toda acción que se programe en instituciones públicas y privadas.", "El trato idéntico y formal ante la ley, sin considerar las condiciones particulares de las personas."]}, {"s": "Igualdad y no discriminación", "q": "Conforme al artículo 2 de la Ley General para la Igualdad entre Mujeres y Hombres, son principios rectores:", "o": ["La máxima publicidad, certeza, eficacia e independencia.", "La igualdad, la no discriminación, la equidad y todos los contenidos en la Constitución.", "La legalidad, objetividad, profesionalismo, honradez y lealtad.", "La licitud, finalidad, proporcionalidad y responsabilidad."]}, {"s": "Igualdad y no discriminación", "q": "¿Cuál es el objeto de la Ley General de Acceso de las Mujeres a una Vida Libre de Violencia según su artículo 1?", "o": ["Establecer la coordinación entre la Federación, las entidades federativas y los municipios para prevenir, sancionar y erradicar la violencia contra las mujeres, y los principios y modalidades para garantizar su acceso a una vida libre de violencia.", "Regular y garantizar la igualdad de oportunidades y de trato entre mujeres y hombres, con lineamientos y mecanismos institucionales hacia la igualdad sustantiva.", "Prevenir y eliminar todas las formas de discriminación contra cualquier persona, y promover la igualdad de oportunidades y de trato.", "Establecer las bases, principios y procedimientos para garantizar el derecho a la protección de los datos personales en posesión de sujetos obligados."]}],K=atob("REJEQkRCQUNDREFDQ0JBQ0NEQkNEQkFEQ0RCQUJB"),L="ABCD",A={},f=document.getElementById("f"),last="",done=false;
